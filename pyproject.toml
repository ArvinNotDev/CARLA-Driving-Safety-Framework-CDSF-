[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-drive-phase1"
version = "0.1.0"
description = "Manual driving simulator foundation for CARLA 0.9.16"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pygame>=2.5,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
carla-drive = "carla_drive.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carla_drive = ["assets/*.wav"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
