# CARLA Drive Phase 1 runtime settings. Copy and tune for the local controller.
carla:
  host: 127.0.0.1
  port: 2000
  traffic_manager_port: 8000
  timeout_seconds: 10.0
  synchronous_mode: true
  fixed_delta_seconds: 0.0333333

window:
  width: 1280
  height: 720
  render_fps: 60

session:
  map_name: null
  weather_preset: ClearNoon
  time_of_day: Noon
  vehicle_blueprint: null
  traffic_vehicles: 0
  pedestrians: 0
  random_seed: 7

camera:
  width: 1280
  height: 720
  mirror_width: 640
  mirror_height: 180
  fov: 100.0
  cockpit_x: 1.15
  cockpit_y: 0.0
  cockpit_z: 1.35
  cockpit_pitch: -3.0
  chase_x: -5.2
  chase_y: 0.0
  chase_z: 2.5
  chase_pitch: -12.0
  overhead_x: -3.0
  overhead_y: 0.0
  overhead_z: 12.0
  overhead_pitch: -68.0
  mirror_x: -1.1
  mirror_y: 0.0
  mirror_z: 1.65
  mirror_yaw: 180.0

lidar:
  enabled: true
  channels: 32
  range_m: 45.0 # Physical sensor range.
  display_range_m: 32.0 # Top-down zoom range; does not shorten the sensor range.
  points_per_second: 60000
  rotation_frequency_hz: 10.0
  display_points: 2500
  persistence_seconds: 0.35
  upper_fov: 10.0
  lower_fov: -30.0

rear_parking:
  enabled: true
  distance_m: 6.0
  hit_radius_m: 0.35
  warning_distance_m: 2.0
  critical_distance_m: 0.6
  stale_after_seconds: 0.6
  sensor_x: -1.4
  sensor_height_m: 0.65
  left_offset_m: -0.65
  right_offset_m: 0.65
  slowest_beep_ms: 900
  fastest_beep_ms: 120

safety:
  enabled: true
  minimum_speed_mps: 2.0
  normal_braking_deceleration_mps2: 10.0
  throttle_release_deceleration_mps2: 3.0
  excess_deceleration_mps2: 4.0
  jerk_threshold_mps3: 75.0
  confirmation_window_seconds: 0.12
  cooldown_seconds: 0.75
  minimum_impact_score: 0.8

controller:
  joystick_index: 0
  steering_axis: 0
  steering_axis_inverted: false
  throttle_axis: 5
  brake_axis: 4
  steering_sensitivity: 1.0
  steering_deadzone: 0.06
  trigger_deadzone: 0.04
  steering_response: 1.35
  throttle_response: 1.0
  brake_response: 1.0
  steering_smoothing: 0.10
  trigger_rest_value: -1.0
  trigger_full_value: 1.0
  reverse_button: 1
  camera_next_button: 0
  camera_previous_button: 2
  handbrake_button: 4
  reset_button: 3
  pause_button: 7
  horn_button: 9
  settings_button: -1
  dpad_mode: auto
  dpad_hat: 0
  dpad_left_button: 13
  dpad_right_button: 14
  dpad_up_button: 11
  dpad_down_button: 12
  require_stop_for_reverse: true
  reverse_stop_speed_mps: 0.8
